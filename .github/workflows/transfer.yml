name: Transfer source from Google Drive

on:
  push:
    branches:
      - arena/548c5470-kliktahu
    paths:
      - ".github/workflows/transfer.yml"
      - "transfer/trigger.txt"
      - "tools/transfer_extract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        run: python -m pip install --upgrade gdown

      - name: Download archive from Google Drive
        run: |
          mkdir -p transfer/incoming
          for attempt in 1 2 3; do
            echo "=== download attempt $attempt ==="
            if python -m gdown "1gq3uW7GVW1vwaN6db03SLeZuUapflT6p" -O transfer/incoming/kliktahu.zip --fuzzy --retries 5; then
              break
            fi
            sleep 10
          done
          ls -la transfer/incoming
          sha256sum transfer/incoming/kliktahu.zip > transfer/incoming/kliktahu.zip.sha256
          cat transfer/incoming/kliktahu.zip.sha256

      - name: Extract sources (audio excluded) and audit env files
        run: python tools/transfer_extract.py

      - name: Commit extracted sources
        run: |
          set -x
          du -sh transfer/extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '*.zip\n*.tar\n*.tar.gz\n*.7z\n*.rar\n' > transfer/incoming/.gitignore
          git add -f transfer/incoming/.gitignore transfer/incoming/kliktahu.zip.sha256
          git add transfer/MANIFEST.txt transfer/SUMMARY.md transfer/WAV_INDEX.txt
          git add transfer/ENV_AUDIT.md transfer/EXTRACT_REPORT.md transfer/extracted
          if [ -d transfer/quarantine ]; then git add -f transfer/quarantine; fi
          git status --short | head -40
          git commit -m "chore(transfer): import project sources from Google Drive archive [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
