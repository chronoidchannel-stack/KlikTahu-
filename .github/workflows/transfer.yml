name: Transfer source from Google Drive

on:
  push:
    branches:
      - arena/548c5470-kliktahu
    paths:
      - ".github/workflows/transfer.yml"
      - "transfer/trigger.txt"
      - "tools/transfer_extract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        run: python -m pip install --upgrade gdown

      - name: Download archive from Google Drive
        run: |
          set -uo pipefail
          mkdir -p transfer/incoming
          ZIP=transfer/incoming/kliktahu.zip
          ID=1gq3uW7GVW1vwaN6db03SLeZuUapflT6p
          rm -f "$ZIP"

          is_zip() {
            [ -s "$ZIP" ] || return 1
            python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).infolist()" "$ZIP"
          }

          got=0
          for attempt in 1 2 3; do
            echo "=== attempt $attempt: curl confirm flow ==="
            curl -sSL --retry 3 --retry-delay 5 -c /tmp/cj -b /tmp/cj \
              "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" \
              -o "$ZIP"
            if is_zip; then got=1; break; fi
            echo "curl result was not a valid zip; retrying"
            rm -f "$ZIP"
            sleep 15
          done

          if [ "$got" = 0 ]; then
            for attempt in 1 2; do
              echo "=== attempt $attempt: gdown ==="
              python -m gdown "$ID" -O "$ZIP" --retries 10 || true
              if is_zip; then got=1; break; fi
              rm -f "$ZIP"
              sleep 15
            done
          fi

          [ "$got" = 1 ] || { echo "download failed"; exit 1; }
          ls -la "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"

      - name: Extract sources (audio excluded) and audit env files
        run: python tools/transfer_extract.py

      - name: Commit extracted sources
        run: |
          set -x
          du -sh transfer/extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '*.zip\n*.tar\n*.tar.gz\n*.7z\n*.rar\n' > transfer/incoming/.gitignore
          git add -f transfer/incoming/.gitignore transfer/incoming/kliktahu.zip.sha256
          git add transfer/MANIFEST.txt transfer/SUMMARY.md transfer/WAV_INDEX.txt
          git add transfer/ENV_AUDIT.md transfer/EXTRACT_REPORT.md transfer/extracted
          if [ -d transfer/quarantine ]; then git add -f transfer/quarantine; fi
          git status --short | head -40
          git commit -m "chore(transfer): import project sources from Google Drive archive [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
