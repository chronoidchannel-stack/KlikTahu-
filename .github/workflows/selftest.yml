name: Selftest (uji ringan, tanpa render video)

# Sesuai aturan keamanan akun (AGEN.md §14): GitHub Actions dipakai HANYA untuk
# membangun/menguji perangkat lunak — bukan untuk merender video. Workflow ini
# menjalankan uji mandiri mesin (< 5 menit, tanpa render penuh, tanpa cron).
#
# Render video dijalankan lokal: `tools/render_lokal.sh <shorts|long> <slug>`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pasang dependensi
        run: pip install -q -r requirements.txt

      - name: Cek sintaks semua modul Python
        run: python -m compileall -q .

      - name: Uji pemulihan audio dan kebersihan repo
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/check_repo_hygiene.py

      - name: Selftest mesin gambar
        run: |
          set -euo pipefail
          python mesin_v11.py
          python diagrams.py
          python sfx.py

      - name: Selftest mesin analisis (offline)
        run: |
          set -euo pipefail
          python analisis/pemeta_peluang.py --uji
          python analisis/mesin_v5.py --uji
          python analisis/mesin_v6.py --uji
          python analisis/sapuan_mendalam.py --uji

      - name: Cek berkas wajib ada
        run: |
          set -euo pipefail
          for f in AGEN.md PUSTAKA.md requirements.txt \
                   fonts/Poppins-Bold.ttf fonts/Poppins-Regular.ttf fonts/OFL.txt \
                   tools/render_lokal.sh tools/restore_audio.py \
                   tools/check_repo_hygiene.py tests/test_restore_audio.py; do
            [ -f "$f" ] || { echo "HILANG: $f"; exit 1; }
          done
          bash -n tools/render_lokal.sh
          echo "semua berkas wajib ada dan skrip render valid"
